[package]
name = "er-compat"
version = "0.1.0"
description = "Compatibility shims for MagicBlock ER and VRF integration"
edition = "2021"

[lib]
name = "er_compat"

[features]
default = ["anchor-shim"]
anchor-shim = ["dep:anchor-lang", "dep:ephemeral-rollups-sdk"]
quasar-vrf = ["dep:ephemeral-rollups-pinocchio", "dep:pinocchio", "dep:quasar-lang", "dep:solana-address"]

[dependencies]
anchor-lang = { version = "1.0.0", optional = true }
ephemeral-rollups-sdk = { version = "0.10.4", features = ["anchor", "disable-realloc"], optional = true }
ephemeral-rollups-pinocchio = { version = "0.15.5", optional = true }
pinocchio = { version = "0.10", default-features = false, features = ["cpi", "alloc"], optional = true }
quasar-lang = { git = "https://github.com/blueshift-gg/quasar", optional = true }
solana-address = { version = "2.5.0", default-features = false, features = ["curve25519"], optional = true }

[dev-dependencies]
solana-program = { version = "3.0.0", default-features = false }
