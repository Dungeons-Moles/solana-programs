[package]
name = "gameplay-state"
version = "0.1.0"
description = "Gameplay State Tracking Program for on-chain game state management"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "gameplay_state"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
mock-vrf = ["vrf-rng/mock-vrf"]
test-helpers = []

[dev-dependencies]
sha2 = "0.10"

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
bincode = "1.3"
ephemeral-rollups-sdk = { version = "0.10.4", features = ["anchor", "disable-realloc"] }
ephemeral-vrf-sdk = { version = "0.2.3", features = ["anchor"] }
er-compat = { path = "../../crates/er-compat" }
magicblock-magic-program-api = { version = "0.8.5", default-features = false }
combat-system = { path = "../../crates/combat-system" }
map-generator = { path = "../map-generator", features = ["cpi"] }
field-enemies = { path = "../../crates/field-enemies" }
boss-system = { path = "../../crates/boss-system" }
player-inventory = { path = "../player-inventory", features = ["cpi"] }
player-profile = { path = "../player-profile", features = ["cpi"] }
vrf-rng = { path = "../../crates/vrf-rng", features = ["anchor"] }
